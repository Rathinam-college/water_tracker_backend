services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: rathinam-backend:prod
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - FORCE_SCRIPT_NAME=/water_tracker
      - PORT=8080
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    image: rathinam-frontend:prod
    env_file: .env
    ports:
      - "8081:80"
    restart: always
