services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=GM
      - POSTGRES_PASSWORD=RathinamGM@32145
      - POSTGRES_DB=water_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: janartlivein/water-tracker-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - FORCE_SCRIPT_NAME=/water_tracker
      - PORT=8080
    restart: always

  frontend:
    image: janartlivein/water-tracker-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/water_tracker/}
    env_file: .env
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
